<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>究極のポケ吉おみくじ</title>
    <style>
        body {
            /* 宇宙をイメージした深い青の背景 */
            background-color: #1a1a2e; 
            text-align: center;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            padding-top: 30px;
            color: #fff; /* 文字を白く */
        }

        h1 {
            /* タイトルは神々しく金色 */
            color: #ffd700; 
            text-shadow: 4px 4px 6px #8b0000; 
            font-size: 3.8em;
            margin-bottom: 20px;
        }
        
        /* 運勢結果の見た目 */
        .luck-wording {
            font-size: 2.2em;
            font-weight: bold;
            color: #ff4500; /* 鮮やかなオレンジ */
            margin-bottom: 10px;
        }
        
        /* おみくじ結果の箱 */
        #result-box {
            background-color: #33334d; /* ダークな背景 */
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 700px; /* 箱を大きく */
            margin: 25px auto;
            padding: 30px;
            font-size: 1.6em;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 8px solid #00ffff; /* 伝説級の光る縁取り */
            color: #eee;
        }

        /* ポケモンの画像を入れるコンテナ */
        .pokemon-container {
            display: flex;
            flex-wrap: wrap; /* 画像が多すぎるときに折り返す */
            justify-content: center;
            gap: 15px; /* 画像間のスペース */
            margin-top: 20px;
        }

        /* ポケモンの画像 */
        .pokemon-image-item {
            max-width: 120px; /* 画像の幅 */
            height: auto;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 5px;
            transition: transform 0.3s ease;
        }
        
        .pokemon-image-item:hover {
            transform: scale(1.1) rotate(5deg); /* ホバーで少し拡大して回転 */
        }
        
        /* ボタン */
        #draw-button {
            background-color: #ff1493; /* ディープピンク */
            color: white;
            border-radius: 35px;
            border: none;
            font-size: 1.8em;
            padding: 20px 50px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            font-weight: bold;
        }

        #draw-button:hover {
            background-color: #c71585;
            transform: translateY(-4px);
        }
        #draw-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>🌠 究極のポケ吉おみくじ 🌠</h1>

    <button id="draw-button" onclick="drawOmikuji()">
        運命のクジを引く！
    </button>

    <div id="result-box">
        <p>上のボタンを押して、宇宙規模の運勢と最強のパートナーポケモンを見てみよう！</p>
    </div>

    <script>
        // ポケモン図鑑（PokeAPI）から画像URLを借りてきています。

        // ウルトラビーストの画像URLリスト
        const ultraBeasts = [
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/793.png", // ウツロイド
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/794.png", // マッシブーン
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/795.png", // フェローチェ
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/796.png", // デンジュモク
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/797.png", // テッカグヤ
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/798.png", // カミツルギ
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/799.png", // アクジキング
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/803.png"  // ベベノム
        ];


        // 1. ポケ吉の「くじ」の中身を用意します。
        const results = [
            { 
                luck: "✨ 大吉 ✨", 
                message: "最強の運勢！伝説たちがあなたに力を授ける！", 
                // コライドン, ミライドン, ハバタクカミ, パオジアン
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1007.png", 
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1008.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/984.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/990.png"
                ]
            },
            { 
                luck: "😊 中吉 😊", 
                message: "最高に可愛いパートナー！素敵な出会いがある予感！", 
                // ピカチュウ, イーブイ, プリン
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png", 
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png"
                ]
            },
            { 
                luck: "🙂 小吉 🙂", 
                message: "ふんわり幸せな一日。ププリンの歌声に癒やされて！", 
                // ププリン
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/174.png"
                ]
            },
            { 
                luck: "😟 凶 😟", 
                message: "今日は少し慎重に。レジギガスが動かす未来に注意！", 
                // レジギガス
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/486.png"
                ]
            },
            { 
                luck: "😭 大凶 😭", 
                message: "どんまい！伝説のパワーで運気を吹き飛ばそう！", 
                // レジドラゴ, レジエレキ
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/895.png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/894.png"
                ]
            },
            { 
                luck: "🌟 ポケ吉 🌟", 
                message: "宇宙のパワーを手にした！すべての最強ポケモンが味方！", 
                // アルセウス, レジギガス, イベルタル, ゼルネアス, ルギア, ホウオウ, ウルトラビースト全員
                pokemonUrls: [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/493.png",  // アルセウス
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/486.png",  // レジギガス
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/717.png",  // イベルタル
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/716.png",  // ゼルネアス
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/249.png",  // ルギア
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/250.png",  // ホウオウ
                    ...ultraBeasts // ウルトラビーストのリストをここで追加
                ]
            }
        ];

        // 2. おみくじを引くための関数を作ります。
        function drawOmikuji() {
            // 2-1. くじの数（resultsの数）を知ります。ここでは 6 (大吉, 中吉, 小吉, 凶, 大凶, ポケ吉) です。
            const maxNumber = results.length;

            // 2-2. 0 から (くじの数 - 1) までのランダムな数字を作ります。
            const randomIndex = Math.floor(Math.random() * maxNumber);

            // 2-3. ランダムな数字を使って、くじの結果を選びます。
            const selectedResult = results[randomIndex];

            // 3. 画面に結果を表示する場所（result-box）を探します。
            const resultBox = document.getElementById('result-box');

            // 4. 表示するHTML（文字と画像）を準備します。
            let displayHtml = '';
            
            // 4-1. 運勢の文字とメッセージを準備します。
            displayHtml += '<div class="luck-wording">' + selectedResult.luck + '</div>';
            displayHtml += '<p>' + selectedResult.message + '</p>';
            
            // 4-2. ポケモンの画像コンテナを準備します。
            displayHtml += '<div class="pokemon-container">';

            // 4-3. 選択された結果のポケモンURLを一つずつ取り出して、画像タグを作ります。
            for (let i = 0; i < selectedResult.pokemonUrls.length; i++) {
                const url = selectedResult.pokemonUrls[i];
                // imgタグにクラス名を追加してCSSを適用します
                displayHtml += '<img class="pokemon-image-item" src="' + url + '" alt="ポケモン画像">';
            }
            
            displayHtml += '</div>'; // pokemon-container を閉じます

            // 5. resultBoxの中に、準備したHTMLを書き込み、画面に表示します。
            resultBox.innerHTML = displayHtml;
        }

        // 6. ページがすべて読み込まれたら、初期メッセージを表示します。
        function initializeOmikuji() {
            const resultBox = document.getElementById('result-box');
            resultBox.innerHTML = '<p>上のボタンを押して、宇宙規模の運勢と最強のパートナーポケモンを見てみよう！</p>';
        }

        // ページが読み込まれたときに初期化関数を実行します
        initializeOmikuji();

    </script>
</body>
</html>
